# Analyses one issue and publishes a Google Doc plus a Discord announcement.
#
# The trigger is `workflow_dispatch` and nothing else, because the issues being analysed live
# in a *different* repository. Workflow events are repo-local: `on: issues` here would only
# ever fire for issues filed against this tooling repo, which is not what anyone wants.
# Instead the target repository runs a small dispatcher workflow (see
# examples/target-repo-dispatch.yml) that calls this one. That also means the manual and
# automatic paths are the same code path — there is no second workflow to drift.
#
# Third-party actions are pinned to commit SHAs; see the top of ci.yml for why.

name: Issue analyst

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyse (digits only)'
        required: true
        type: string
      target_repo:
        description: 'owner/repo holding the issue. Defaults to the TARGET_REPOSITORY variable.'
        required: false
        type: string
      dry_run:
        description: 'Analyse and render, but publish nothing (no Doc, no Discord)'
        required: false
        default: false
        type: boolean

# `contents: read` and nothing else.
#
# There is deliberately no `issues: write` any more: the agent publishes to a Google Doc and
# to Discord and never writes back to a repository, so the token it holds cannot be talked
# into writing anywhere. That closes the class of attack this workflow is most exposed to —
# the issue body is attacker-controlled text read by a model with shell access to the
# checkout, and a writable token turns that into a write to this very file on the next run.
#
# Note that this token cannot read the target repository's private issues either. That is
# fine while the target is public; a private target needs a read-only PAT in GITHUB_TOKEN.
permissions:
  contents: read

# Keyed on both repo and issue, since one analyst repo may serve several targets.
concurrency:
  group: issue-analyst-${{ inputs.target_repo }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      TARGET_REPOSITORY: ${{ inputs.target_repo || vars.TARGET_REPOSITORY }}
      # Compared against the string as well as the boolean: a `type: boolean` input arrives
      # as a real boolean from the UI but as the *string* "false" from the REST API, and a
      # non-empty string is truthy. `inputs.dry_run && …` alone would silently dry-run every
      # dispatcher-triggered run.
      DRY_RUN: ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '1' || '0' }}
      RUN_JSON: ${{ github.workspace }}/run/agent.json
      RUN_LOG: ${{ github.workspace }}/run/agent.log
      AGENT_RESULT_JSON: ${{ github.workspace }}/run/result.json

    steps:
      # `workflow_dispatch` inputs are free text and reach a shell command and an API call.
      # Reject anything malformed before it gets near either.
      - name: Validate the inputs
        run: |
          case "$ISSUE_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::issue_number must be digits only." >&2
              exit 1
              ;;
          esac
          case "$TARGET_REPOSITORY" in
            '')
              echo "::error::No target repository. Pass target_repo, or set the TARGET_REPOSITORY variable." >&2
              exit 1
              ;;
            */*/*|/*|*/)
              echo "::error::target_repo must be exactly owner/repo." >&2
              exit 1
              ;;
            */*) ;;
            *)
              echo "::error::target_repo must be owner/repo." >&2
              exit 1
              ;;
          esac
          echo "Analysing issue #$ISSUE_NUMBER in $TARGET_REPOSITORY (DRY_RUN=$DRY_RUN)."

      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare run directory
        run: mkdir -p "$(dirname "$RUN_JSON")"

      # The bot-author guard is enforced in the publish tool, which checks `issue.isBot` after
      # fetching and returns `skipped` (src/tools/analyze-and-publish.ts). It cannot be an
      # `if:` here because a dispatch carries no issue payload — and putting it only in the
      # dispatcher would leave manual runs unguarded.
      - name: Analyse (primary model)
        id: primary
        continue-on-error: true
        env:
          FLUE_MODEL: ${{ vars.PRIMARY_MODEL || 'github-copilot/claude-opus-4.7' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      # Both legs run through GitHub Copilot and so share one credential. The fallback buys
      # vendor diversity by model, not by provider: Copilot's catalog spans four vendors, so a
      # Claude-side outage does not take out both legs, and there is no second API key to
      # provision, rotate, or leak. `src/env.ts` rejects any specifier outside
      # `github-copilot`.
      - name: Analyse (fallback model)
        id: fallback
        if: steps.primary.outcome == 'failure'
        env:
          FLUE_MODEL: ${{ vars.FALLBACK_MODEL || 'github-copilot/gpt-5.4' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      # This assertion is required, not belt-and-braces: `continue-on-error` on the primary
      # means nothing else can turn "both legs failed" into a red run.
      #
      # Two things get checked, because either alone passes when the run did nothing useful:
      #
      #   1. The --json envelope's outcome is "completed". (Never "success" — that value does
      #      not exist. The set is completed / failed / aborted / error.)
      #   2. The result file names a Doc. The envelope alone cannot tell a publish from a dry
      #      run from a skipped bot issue, and the Doc URL is nowhere else to be found: the
      #      tool returns `terminate: true` so the envelope's `message` is empty, and the CLI
      #      presenter prints "tool done analyze_and_publish" without the result payload.
      #      Since the agent no longer comments on the issue, there is also no API-visible
      #      artefact to look for. Hence AGENT_RESULT_JSON (src/run-summary.ts).
      - name: Assert the run completed
        id: assert
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');

            const readOrEmpty = (path) => {
              try {
                return fs.readFileSync(path, 'utf8');
              } catch {
                return '';
              }
            };

            const raw = readOrEmpty(process.env.RUN_JSON);
            if (raw.trim() === '') {
              core.setFailed('No --json envelope was produced: both model legs failed to start.');
              return;
            }

            const line = raw.trim().split('\n').filter((l) => l.trim() !== '').pop();
            let envelope;
            try {
              envelope = JSON.parse(line);
            } catch {
              core.setFailed('The --json envelope was not valid JSON.');
              return;
            }

            if (envelope.outcome !== 'completed') {
              const detail = envelope.error ? JSON.stringify(envelope.error).slice(0, 500) : '(no error payload)';
              core.setFailed(`Run outcome was "${envelope.outcome}", expected "completed". ${detail}`);
              return;
            }

            const resultRaw = readOrEmpty(process.env.AGENT_RESULT_JSON);
            if (resultRaw.trim() === '') {
              core.setFailed(
                'Run outcome was "completed" but the agent wrote no result file, so it ' +
                  'reached neither a publish, a dry run, nor a bot skip.',
              );
              return;
            }

            let result;
            try {
              result = JSON.parse(resultRaw);
            } catch {
              core.setFailed('The agent result file was not valid JSON.');
              return;
            }

            if (result.status === 'skipped') {
              core.info(`Issue #${result.issueNumber} was filed by a bot and skipped, as intended.`);
              return;
            }

            const expected = process.env.DRY_RUN === '1' ? 'dry-run' : 'published';
            if (result.status !== expected) {
              core.setFailed(`Agent reported status "${result.status}", expected "${expected}".`);
              return;
            }

            if (result.repository !== process.env.TARGET_REPOSITORY) {
              core.setFailed(
                `Agent analysed "${result.repository}" but this run targeted ` +
                  `"${process.env.TARGET_REPOSITORY}".`,
              );
              return;
            }

            if (expected === 'dry-run') {
              core.info('Dry run completed; nothing was published, as intended.');
              return;
            }

            if (!/^https:\/\/docs\.google\.com\//.test(result.docUrl ?? '')) {
              core.setFailed('Agent reported "published" but with no Google Docs URL.');
              return;
            }

            core.info(`Analysis published: ${result.docUrl}`);
            if (result.injectionSuspected) {
              core.warning(
                `The analysis of ${result.repository}#${result.issueNumber} flagged a ` +
                  'possible prompt-injection attempt. Review the Doc before acting on it.',
              );
            }

      # There is no comment-on-failure step: this workflow holds no write permission on any
      # repository, which is the point. A failure surfaces as a red run here, and the target
      # repository's dispatcher never hears back — so if silent failure is unacceptable, the
      # place to add notification is Discord, using the webhook this repo already holds.
      - name: Show the run log on failure
        if: always() && steps.assert.outcome == 'failure'
        run: |
          echo "::group::agent stderr"
          tail -n 200 "$RUN_LOG" 2>/dev/null || echo '(no log)'
          echo "::endgroup::"
