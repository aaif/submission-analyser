# Analyse a newly filed issue and publish the analysis (Google Doc + issue comment +
# Discord). One run per issue. Third-party actions are pinned to commit SHAs — the reason is
# spelled out at the top of ci.yml.

name: Issue analyst

on:
  issues:
    types: [opened, labeled]

# EXACTLY these two, and no more.
#
# `contents: write` must never appear here. This job feeds an attacker-controlled issue body
# to a model that has shell access to the checkout (`local()` provides no isolation and
# mounts the file and shell tools regardless of any allow-list). With a read-only token, a
# write to the checkout is inert — it dies with the runner. With a writable token, the same
# write lands in the repository, and this workflow file itself becomes attacker-controlled:
# an injected issue body would have achieved arbitrary code execution, with these
# credentials, on the next run. Same reasoning for `pull-requests: write` and for
# `id-token: write`, which would hand an injected run a federated identity in the cloud.
permissions:
  contents: read
  issues: write

# One run per issue, and never cancel a run in flight. `cancel-in-progress: true` would be
# actively harmful: the publish tool creates the Doc *before* it comments on the issue, so a
# cancellation lands in the window where a Doc exists that nobody has been told about.
# Queueing costs a few minutes; cancelling costs a silently orphaned artefact.
concurrency:
  group: issue-analyst-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  analyse:
    # Two guards:
    #  - Skip bot authors. The agent comments on the issue it analysed, so an agent that
    #    analysed its own bots' issues is a loop waiting for a second bot to join in.
    #    (src/tools/analyze-and-publish.ts re-checks `issue.isBot` and returns `skipped`,
    #    belt and braces, but not spending a runner at all is better.)
    #  - On `labeled`, only proceed for `needs-analysis`. Without this, every label added to
    #    every issue forever would trigger a paid analysis run.
    if: >-
      github.event.issue.user.type != 'Bot'
      && !endsWith(github.event.issue.user.login, '[bot]')
      && (github.event.action == 'opened' || github.event.label.name == 'needs-analysis')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # Both legs write the same two paths, so the envelope check below always reads whichever
      # leg ran last. The primary's own stderr stays visible in its step log; the .log copy is
      # for a human debugging a failure, nothing asserts on it.
      RUN_JSON: ${{ github.workspace }}/run/agent.json
      RUN_LOG: ${{ github.workspace }}/run/agent.log

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare run directory
        run: mkdir -p "$(dirname "$RUN_JSON")"

      # Recorded before either model leg runs, so the publication check below can ignore
      # analysis comments left by an earlier run of this same workflow (a re-label, a retry)
      # and only accept one this run produced.
      - name: Record the run start time
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Fallback lives at the workflow level, not inside the run: `useModel()` is
      # submission-scoped, and a one-shot CI run is a single submission, so there is no
      # in-run model swap to be had (DESIGN.md §4). Two processes, two models.
      #
      # Model specifiers come from repo *vars*, not secrets: they are not sensitive, and an
      # operator switching models mid-incident should be able to see and edit the current
      # value in one click. Specifiers use dots — `github-copilot/claude-opus-4.7`.
      #
      # Secrets are asymmetric per step on purpose. The primary receives COPILOT_GITHUB_TOKEN
      # and not GEMINI_API_KEY; the fallback the reverse. Each leg is handed exactly the
      # model credential it can use, so a compromised or misbehaving run cannot reach the
      # other provider's key at all.
      - name: Analyse (primary model)
        id: primary
        continue-on-error: true
        env:
          FLUE_MODEL: ${{ vars.PRIMARY_MODEL || 'github-copilot/claude-opus-4.7' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      # A second, clean process with a fresh sandbox. Known cost, accepted in DESIGN.md §4:
      # a primary that failed *after* creating the Doc leaves a duplicate Doc behind.
      - name: Analyse (fallback model)
        id: fallback
        if: steps.primary.outcome == 'failure'
        env:
          FLUE_MODEL: ${{ vars.FALLBACK_MODEL || 'google/gemini-2.5-pro' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      # REQUIRED. Do not delete this step, and do not make it `continue-on-error`.
      #
      # `continue-on-error: true` on the primary means its failure does not fail the job. If
      # the fallback also fails, GitHub still needs *something* to mark the job red — and
      # without this step nothing does. The job would report success having published
      # nothing, which is the worst outcome in the entire design: nobody is paged, the issue
      # sits unanalysed, and the green tick actively argues against looking.
      #
      # Two assertions, because "the process exited 0" is not the same as "an analysis
      # exists":
      #   1. The `--json` envelope must say outcome == "completed". The CLI's values are
      #      completed / failed / aborted / error — there is NO "success" value, and
      #      asserting on one would silently never match, making this step decorative.
      #   2. A Doc link must actually be visible on the issue.
      #
      # (2) is checked against the GitHub API rather than by grepping the run output, because
      # the Doc URL never appears in that output: with `--json` the envelope's `message` is
      # empty when the tool terminates the turn, and the CLI presenter prints only
      # "tool done analyze_and_publish", never the tool's result payload. The issue comment
      # the publish tool posts is where publication is actually observable — and it is also
      # the thing that matters, since it is what the reporter sees.
      - name: Assert an analysis was published
        id: assert
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');

            let raw = '';
            try {
              raw = fs.readFileSync(process.env.RUN_JSON, 'utf8');
            } catch {
              /* handled immediately below */
            }

            if (raw.trim() === '') {
              core.setFailed('No --json envelope was produced: both model legs failed to start.');
              return;
            }

            // With --json the CLI prints exactly one JSON line to stdout; take the last
            // non-empty line so a stray line from a wrapper cannot break the parse.
            const line = raw.trim().split('\n').filter((l) => l.trim() !== '').pop();
            let envelope;
            try {
              envelope = JSON.parse(line);
            } catch {
              core.setFailed('The --json envelope was not valid JSON.');
              return;
            }

            if (envelope.outcome !== 'completed') {
              const detail = envelope.error ? JSON.stringify(envelope.error).slice(0, 500) : '(no error payload)';
              core.setFailed(`Run outcome was "${envelope.outcome}", expected "completed". ${detail}`);
              return;
            }

            const issue_number = Number(process.env.ISSUE_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              since: process.env.RUN_STARTED_AT,
              per_page: 100,
            });

            const published = comments.find((comment) =>
              /https:\/\/docs\.google\.com\//.test(comment.body ?? ''),
            );

            if (!published) {
              core.setFailed(
                'Run outcome was "completed" but no comment containing an analysis Doc link ' +
                  'appeared on the issue during this run, so nothing was published.',
              );
              return;
            }

            core.info(`Analysis comment published: ${published.html_url}`);

      # Tell the human who filed the issue that the automation broke, rather than leaving
      # them waiting on a comment that is never coming.
      #
      # Loop safety, three ways: this comment is written by github-actions[bot], the workflow
      # triggers only on `issues: [opened, labeled]` (a comment is neither), and the job's
      # `if:` skips bot authors. It cannot re-enter. The step is conditioned on the assertion
      # specifically — not on `failure()` — so an unrelated failure (npm ci, a runner fault)
      # does not post a misleading "analysis failed" note.
      - name: Comment that the analysis failed
        if: always() && steps.assert.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                'Automated analysis failed for this issue, so no analysis Doc was produced.',
                '',
                `A maintainer can inspect the [workflow run](${url}) and re-run the analysis with the`,
                '`issue-analyst-manual` workflow, or by adding the `needs-analysis` label.',
                '',
                '_This note is automated; the issue itself has not been triaged yet._',
              ].join('\n'),
            });
