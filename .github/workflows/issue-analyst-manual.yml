# Manual re-run of the issue analysis, for when the automatic run failed, was skipped, or
# needs repeating after a fix. Same permissions, same guards, same assertion as
# issue-analyst.yml — this exists to change the *trigger*, nothing else.
# Third-party actions are pinned to commit SHAs; see the top of ci.yml for why.

name: Issue analyst (manual)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyse (digits only)'
        required: true
        type: string
      dry_run:
        description: 'Analyse and render, but publish nothing (no Doc, no comment, no Discord)'
        required: false
        default: false
        type: boolean

# Identical to issue-analyst.yml, and for identical reasons. Never `contents: write`: the
# issue body is attacker-controlled text read by a model with shell access to the checkout,
# and a writable token turns that into a write to this workflow file on the next run.
permissions:
  contents: read
  issues: write

concurrency:
  group: issue-analyst-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      RUN_JSON: ${{ github.workspace }}/run/agent.json
      RUN_LOG: ${{ github.workspace }}/run/agent.log

    steps:
      # `workflow_dispatch` inputs are free text, and this one is interpolated into a shell
      # command and a URL. Reject anything that is not a plain positive integer before it
      # gets anywhere near either.
      - name: Validate the issue number
        run: |
          case "$ISSUE_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::issue_number must be digits only." >&2
              exit 1
              ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare run directory
        run: mkdir -p "$(dirname "$RUN_JSON")"

      # So the publication check below only accepts a comment this run produced, not one left
      # by an earlier run on the same issue.
      - name: Record the run start time
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The bot-author guard cannot be an `if:` here — there is no issue payload on a
      # dispatch — so it is enforced where it also holds for the automatic workflow: the
      # publish tool checks `issue.isBot` after fetching and returns `skipped`
      # (src/tools/analyze-and-publish.ts).
      - name: Analyse (primary model)
        id: primary
        continue-on-error: true
        env:
          FLUE_MODEL: ${{ vars.PRIMARY_MODEL || 'github-copilot/claude-opus-4.7' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      - name: Analyse (fallback model)
        id: fallback
        if: steps.primary.outcome == 'failure'
        env:
          FLUE_MODEL: ${{ vars.FALLBACK_MODEL || 'github-copilot/gpt-5.4' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      # Same required assertion as the automatic workflow, for the same reason:
      # `continue-on-error` on the primary means nothing else can turn "both legs failed" into
      # a red run. The envelope outcome must be "completed" (never "success" — that value does
      # not exist), and for a real run a Doc link must have appeared on the issue.
      #
      # The Doc link is checked against the API, not the run output: with `--json` the
      # envelope's `message` is empty when the tool terminates the turn, and the CLI presenter
      # prints "tool done analyze_and_publish" without the result payload, so the URL is not
      # in the log at all.
      #
      # Under DRY_RUN the tool returns status "dry-run" and publishes nothing, so only the
      # outcome is checked — demanding a Doc link would fail every dry run by design.
      - name: Assert the run completed
        id: assert
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');

            let raw = '';
            try {
              raw = fs.readFileSync(process.env.RUN_JSON, 'utf8');
            } catch {
              /* handled immediately below */
            }

            if (raw.trim() === '') {
              core.setFailed('No --json envelope was produced: both model legs failed to start.');
              return;
            }

            const line = raw.trim().split('\n').filter((l) => l.trim() !== '').pop();
            let envelope;
            try {
              envelope = JSON.parse(line);
            } catch {
              core.setFailed('The --json envelope was not valid JSON.');
              return;
            }

            if (envelope.outcome !== 'completed') {
              const detail = envelope.error ? JSON.stringify(envelope.error).slice(0, 500) : '(no error payload)';
              core.setFailed(`Run outcome was "${envelope.outcome}", expected "completed". ${detail}`);
              return;
            }

            if (process.env.DRY_RUN === '1') {
              core.info('Dry run completed; nothing was published, as intended.');
              return;
            }

            const issue_number = Number(process.env.ISSUE_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              since: process.env.RUN_STARTED_AT,
              per_page: 100,
            });

            const published = comments.find((comment) =>
              /https:\/\/docs\.google\.com\//.test(comment.body ?? ''),
            );

            if (!published) {
              core.setFailed(
                'Run outcome was "completed" but no comment containing an analysis Doc link ' +
                  'appeared on the issue during this run, so nothing was published.',
              );
              return;
            }

            core.info(`Analysis comment published: ${published.html_url}`);

      # A dry run publishes nothing, so there is nothing to apologise for and no comment to
      # post. A failed real run gets the same note as the automatic workflow, so the reporter
      # is not left waiting in silence.
      - name: Comment that the analysis failed
        if: always() && steps.assert.outcome == 'failure' && inputs.dry_run != true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                'A manually triggered analysis of this issue failed, so no analysis Doc was produced.',
                '',
                `A maintainer can inspect the [workflow run](${url}) and try again.`,
                '',
                '_This note is automated; the issue itself has not been triaged yet._',
              ].join('\n'),
            });
