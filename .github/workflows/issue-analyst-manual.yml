# Manual re-run of the issue analysis, for when the automatic run failed, was skipped, or
# needs repeating after a fix. Same permissions, same guards, same assertion as
# issue-analyst.yml — this exists to change the *trigger*, nothing else.
# Third-party actions are pinned to commit SHAs; see the top of ci.yml for why.

name: Issue analyst (manual)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyse (digits only)'
        required: true
        type: string
      dry_run:
        description: 'Analyse and render, but publish nothing (no Doc, no comment, no Discord)'
        required: false
        default: false
        type: boolean

# Identical to issue-analyst.yml, and for identical reasons. Never `contents: write`: the
# issue body is attacker-controlled text read by a model with shell access to the checkout,
# and a writable token turns that into a write to this workflow file on the next run.
permissions:
  contents: read
  issues: write

concurrency:
  group: issue-analyst-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      RUN_JSON: ${{ github.workspace }}/run/agent.json
      RUN_LOG: ${{ github.workspace }}/run/agent.log

    steps:
      # `workflow_dispatch` inputs are free text, and this one is interpolated into a shell
      # command and a URL. Reject anything that is not a plain positive integer before it
      # gets anywhere near either.
      - name: Validate the issue number
        run: |
          case "$ISSUE_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::issue_number must be digits only." >&2
              exit 1
              ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare run directory
        run: mkdir -p "$(dirname "$RUN_JSON")"

      # The bot-author guard cannot be an `if:` here — there is no issue payload on a
      # dispatch — so it is enforced where it also holds for the automatic workflow: the
      # publish tool checks `issue.isBot` after fetching and returns `skipped`
      # (src/tools/analyze-and-publish.ts).
      - name: Analyse (primary model)
        id: primary
        continue-on-error: true
        env:
          FLUE_MODEL: ${{ vars.PRIMARY_MODEL || 'github-copilot/claude-opus-4.7' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      - name: Analyse (fallback model)
        id: fallback
        if: steps.primary.outcome == 'failure'
        env:
          FLUE_MODEL: ${{ vars.FALLBACK_MODEL || 'google/gemini-2.5-pro' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          npx flue run src/agents/issue-analyst.ts \
            --id "$ISSUE_NUMBER" \
            --message "Analyse issue #$ISSUE_NUMBER" \
            --json \
            > "$RUN_JSON" \
            2> >(tee "$RUN_LOG" >&2)

      # Same required assertion as the automatic workflow: `continue-on-error` on the primary
      # means nothing else can turn "both legs failed" into a red run. Under DRY_RUN the tool
      # returns status "dry-run" and publishes nothing, so only the envelope outcome is
      # checked — demanding a Doc URL would fail every dry run by design.
      - name: Assert the run completed
        id: assert
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
          const jsonRaw = read(process.env.RUN_JSON);
          const logRaw = read(process.env.RUN_LOG);
          const dryRun = process.env.DRY_RUN === '1';

          const fail = (why) => {
            console.error(`::error::Issue analysis did not complete: ${why}`);
            process.exit(1);
          };

          if (jsonRaw.trim() === '') fail('no --json envelope was produced; both model legs failed to start.');

          const line = jsonRaw.trim().split('\n').filter((l) => l.trim() !== '').pop();
          let envelope;
          try { envelope = JSON.parse(line); } catch { fail('the --json envelope was not valid JSON.'); }

          if (envelope.outcome !== 'completed') {
            const detail = envelope.error ? JSON.stringify(envelope.error).slice(0, 500) : '(no error payload)';
            fail(`outcome was "${envelope.outcome}", expected "completed". ${detail}`);
          }

          if (dryRun) {
            console.log('Dry run completed; nothing was published, as intended.');
            process.exit(0);
          }

          const docUrl = `${envelope.message ?? ''}\n${logRaw}`.match(
            /https:\/\/docs\.google\.com\/[^\s"'()<>\]]+/,
          );
          if (!docUrl) {
            fail('outcome was "completed" but no Google Doc URL appears in the run output, so nothing was published.');
          }

          console.log(`Published analysis Doc: ${docUrl[0]}`);
          NODE

      # A dry run publishes nothing, so there is nothing to apologise for and no comment to
      # post. A failed real run gets the same note as the automatic workflow, so the reporter
      # is not left waiting in silence.
      - name: Comment that the analysis failed
        if: always() && steps.assert.outcome == 'failure' && inputs.dry_run != true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                'A manually triggered analysis of this issue failed, so no analysis Doc was produced.',
                '',
                `A maintainer can inspect the [workflow run](${url}) and try again.`,
                '',
                '_This note is automated; the issue itself has not been triaged yet._',
              ].join('\n'),
            });
